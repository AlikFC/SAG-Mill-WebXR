<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PoC SAG Mill - WebXR</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #info { position: absolute; top: 10px; width: 100%; text-align: center; color: white; pointer-events: none; }
    </style>
    <!-- Actualizamos la versión de la librería quitando el @0.4.2 -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
            "@mkkellogg/gaussian-splats-3d": "https://unpkg.com/@mkkellogg/gaussian-splats-3d/build/gaussian-splats-3d.module.js"
        }
    }
    </script>
</head>
<body>
    <div id="info">Loading SAG Mill...</div>
    <script type="module">
        import * as THREE from 'three';
        import * as GaussianSplats3D from '@mkkellogg/gaussian-splats-3d';

        const viewer = new GaussianSplats3D.Viewer({
            'cameraUp': [0, 1, 0],
            'initialCameraPosition': [0, 1.5, 5],
            'initialCameraLookAt': [0, 1.5, 0],
            'webXRMode': true,
            'sharedMemoryForWorkers': false
        });

        // TÁCTICA ROMPE-CACHÉ: Agregamos la fecha actual al final del archivo
        // Esto obliga a GitHub Pages a soltar el archivo en lugar de usar memoria muerta
        const sceneFile = './SAG_aereo_crop2.ksplat?v=' + Date.now(); 

        // Creamos la rotación usando Euler (X, Y, Z en radianes) y la pasamos a Cuaternión.
        // Math.PI / 2 equivale a 90 grados. Cambia el signo o el eje según hacia dónde esté volteado.
        const rotacionCorregida = new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.PI, 0, 0)).toArray();

        viewer.addSplatScene(sceneFile, {
            'showLoadingUI': true,
            'splatAlphaCrop': 0.1,
            'format': GaussianSplats3D.SceneFormat.KSplat,
            'rotation': rotacionCorregida // Aplicamos el cuaternión calculado
        })
        .then(() => {
            document.getElementById('info').style.display = 'none';
            viewer.start();
        })
        .catch((err) => {
            // Ahora sí deberíamos ver el error real si algo falla
            document.getElementById('info').innerHTML = 'Error Real: ' + err.message;
            console.error("Fallo detallado:", err);
        });
    </script>
</body>
</html>
